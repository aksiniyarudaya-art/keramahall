name: screenshots
on:
  push:
    branches: [screenshots]
    paths: ['tools/capture.js', '.github/workflows/screenshots.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  shots:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm i --no-save playwright@1.47.2 && npx playwright install --with-deps chromium
      - run: node tools/capture.js clean && node tools/capture.js full
      - run: ls -la shots | head -80
      - name: Commit screenshots
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add shots
          git commit -m "Скриншоты с keramahall.vercel.app [skip ci]" || echo "nothing to commit"
          git push origin HEAD:screenshots
